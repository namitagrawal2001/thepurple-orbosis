services:
  postgres:
    image: postgres:16-alpine
    container_name: thepurple_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-thepurple_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in the root .env file}
      POSTGRES_DB: ${DB_NAME:-thepurple_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-thepurple_admin} -d ${DB_NAME:-thepurple_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    image: redis:7-alpine
    container_name: thepurple_redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - redis_password
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - sh
      - -ec
      - |
        password="$$(cat /run/secrets/redis_password)"
        case "$$password" in *[!a-fA-F0-9]*|'') echo "Redis password must be hexadecimal." >&2; exit 1;; esac
        test "$${#password}" -ge 48
        printf 'requirepass %s\nappendonly yes\n' "$$password" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: thepurple_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?Set MEILISEARCH_MASTER_KEY in the root .env file}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  db-bootstrap:
    image: postgres:16-alpine
    container_name: thepurple_db_bootstrap
    restart: "no"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        test "$$DB_ADMIN_USER" != "$$DB_MIGRATION_USER"
        test "$$DB_ADMIN_USER" != "$$DB_USER"
        test "$$DB_MIGRATION_USER" != "$$DB_USER"
        test "$${#DB_ADMIN_PASSWORD}" -ge 24
        test "$${#DB_MIGRATION_PASSWORD}" -ge 24
        test "$${#DB_PASSWORD}" -ge 24
        test "$$DB_ADMIN_PASSWORD" != "$$DB_MIGRATION_PASSWORD"
        test "$$DB_ADMIN_PASSWORD" != "$$DB_PASSWORD"
        test "$$DB_MIGRATION_PASSWORD" != "$$DB_PASSWORD"
        export PGPASSWORD="$$DB_ADMIN_PASSWORD"
        exec psql --host=postgres --username="$$DB_ADMIN_USER" --dbname="$$DB_NAME" \
          --set=admin_user="$$DB_ADMIN_USER" \
          --set=migration_user="$$DB_MIGRATION_USER" \
          --set=app_user="$$DB_USER" \
          --set=database_name="$$DB_NAME" \
          --file=/run/config/provision-database-roles.sql
    environment:
      DB_ADMIN_USER: ${DB_ADMIN_USER:-thepurple_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in the root .env file}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-thepurple_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in the root .env file}
      DB_USER: ${DB_USER:-thepurple_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_NAME: ${DB_NAME:-thepurple_db}
    volumes:
      - ./scripts/provision-database-roles.sql:/run/config/provision-database-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${BACKEND_IMAGE:-namitagrawal/thepurple-backend:${IMAGE_TAG:-latest}}
    pull_policy: always
    container_name: thepurple_migrate
    restart: "no"
    command: ["node", "src/migrations/run.js"]
    environment:
      NODE_ENV: migration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thepurple_db}
      DB_USER: ${DB_MIGRATION_USER:-thepurple_migrator}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in the root .env file}
      DB_DIALECT: postgres
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:-namitagrawal/thepurple-backend:${IMAGE_TAG:-latest}}
    pull_policy: always
    container_name: thepurple_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in the root .env file}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thepurple_db}
      DB_USER: ${DB_USER:-thepurple_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_DIALECT: postgres
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?Set MEILISEARCH_MASTER_KEY in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:?Set ADMIN_INITIAL_EMAIL in the root .env file}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-thepurple-media}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-https://media.thepurple.in}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_API_KEY: ${SHIPROCKET_API_KEY:-}
      SHIPROCKET_API_SECRET: ${SHIPROCKET_API_SECRET:-}
      SHIPROCKET_WEBHOOK_SECRET: ${SHIPROCKET_WEBHOOK_SECRET:-}
      SHIPROCKET_SYNC_CRON_MINUTES: ${SHIPROCKET_SYNC_CRON_MINUTES:-15}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the root .env file}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in the root .env file}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in the root .env file}
      SMTP_FROM: ${SMTP_FROM:-ThePurple <no-reply@thepurple.in>}
    ports:
      - "127.0.0.1:5000:5000"
    secrets:
      - redis_password
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - public
      - app
      - data

  frontend:
    image: ${FRONTEND_IMAGE:-namitagrawal/thepurple-frontend:${IMAGE_TAG:-latest}}
    pull_policy: always
    container_name: thepurple_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - public
      - app

secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secrets/redis_password}

networks:
  public:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  meili_data: